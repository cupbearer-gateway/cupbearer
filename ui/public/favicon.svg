<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7170ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="laneMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b9bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9b9bff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#08090a"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <!-- Three streams converging into one node: the pool concept. -->
  <path d="M4 7 C13 7, 13 16, 22 16" stroke="url(#lane)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M4 16 L22 16" stroke="url(#laneMid)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M4 25 C13 25, 13 16, 22 16" stroke="url(#lane)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="24.5" cy="16" r="3.6" fill="#9b9bff" stroke="#08090a" stroke-width="1.5"/>
</svg>
