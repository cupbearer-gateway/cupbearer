name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The server has zero runtime dependencies; the UI has its own lockfile.
      - name: Unit tests
        run: npm test
      - name: End-to-end smoke (stub upstreams, no keys)
        run: npm run smoke
      - name: Dashboard build
        run: npm --prefix ui install --no-audit --no-fund && npm run build
      - name: Benchmark dry run
        run: node scripts/benchmark.js --stub --reps 1 --out benchmark-ci
