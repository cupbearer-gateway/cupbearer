name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths: [landing/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The canonical logo lives in ui/public (the app and the icon scripts
      # derive from it); landing gets a synced copy at deploy time instead of
      # keeping a duplicate binary in git.
      - name: Sync canonical logo
        run: cp ui/public/logo.png landing/logo.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
